version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: securepass_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - securepass_network
    # No se expone el puerto 5432 al host: solo es accesible desde la red interna.

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securepass_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    networks:
      - securepass_network

volumes:
  postgres_data:
  static_volume:

networks:
  securepass_network:
    driver: bridge
